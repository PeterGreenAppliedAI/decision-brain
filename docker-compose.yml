# Stock FalkorDB, nothing project-specific — infrastructure, allowed before the event.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6380:6379"   # 6380 on the host: the parent project's FalkorDB already owns 6379
      - "127.0.0.1:3030:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/data
volumes:
  falkordb-data:
